<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmic Merge — Game Galaxy</title>

    <!-- Standard favicon -->
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
    <!-- PNG favicons -->
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <!-- Android / Chrome icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="assets/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/android-chrome-512x512.png">
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #070b19;
            --panel: rgba(15, 23, 42, 0.75);
            --border: rgba(255, 255, 255, 0.12);
            --accent: #6ee7b7;
            --accent-2: #60a5fa;
            --accent-purple: #c084fc;
            --danger: #ef4444;
            --text: #f1f5f9;
            --muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg);
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        #game-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: radial-gradient(circle at 50% 20%, #111e3b 0%, #070b19 80%);
            padding: 6px 8px;
            box-sizing: border-box;
        }

        /* Top Header UI */
        header.game-header {
            width: 100%;
            max-width: 480px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            z-index: 10;
        }

        .brand-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--panel);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 14px;
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            display: grid;
            place-items: center;
            font-weight: 900;
            font-size: 14px;
            color: #070b19;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .brand-title {
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #e2e8f0, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats-group {
            display: flex;
            gap: 6px;
        }

        .stat-card {
            background: var(--panel);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 4px 10px;
            min-width: 64px;
            text-align: center;
        }

        .stat-label {
            font-size: 9px;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 15px;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
        }

        .next-preview-card {
            background: var(--panel);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 4px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 52px;
        }

        .next-preview-canvas {
            width: 26px;
            height: 26px;
        }

        .btn-icon {
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: transform 0.1s, background 0.2s;
        }

        .btn-icon:active {
            transform: scale(0.92);
        }

        /* Canvas Arena Container */
        #canvas-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto 0;
            flex-shrink: 0;
        }

        canvas#simCanvas {
            display: block;
            border-radius: 18px;
            border: 1.5px solid rgba(110, 231, 183, 0.2);
            box-shadow: 0 0 30px rgba(14, 165, 233, 0.15), inset 0 0 40px rgba(0, 0, 0, 0.6);
            touch-action: none;
            background: #060914;
        }

        /* Bottom Controls / Help Bar */
        footer.game-footer {
            width: 100%;
            max-width: 480px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--muted);
            padding: 0 4px;
        }

        .footer-tip {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tier-evolution-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--accent-2);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tier-evolution-btn:hover {
            background: rgba(96, 165, 250, 0.15);
        }

        /* Modals & Overlays */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 7, 18, 0.88);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: linear-gradient(180deg, rgba(23, 37, 84, 0.96), rgba(15, 23, 42, 0.98));
            border: 1px solid rgba(96, 165, 250, 0.35);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 24px rgba(56, 189, 248, 0.2);
            border-radius: 18px;
            padding: 18px 16px;
            width: 90%;
            max-width: 320px;
            flex-shrink: 0;
            box-sizing: border-box;
            text-align: center;
            transform: scale(0.92);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @media (max-width: 440px) {
            .brand-title {
                display: none;
            }
            .brand-pill {
                padding: 4px 6px;
            }
            .brand-icon {
                width: 24px;
                height: 24px;
                font-size: 12px;
            }
            .stat-card {
                padding: 3px 6px;
                min-width: 50px;
                border-radius: 10px;
            }
            .stat-label {
                font-size: 8px;
            }
            .stat-value {
                font-size: 13px;
            }
            .next-preview-card {
                padding: 3px 6px;
                min-width: 44px;
                border-radius: 10px;
            }
            .next-preview-canvas {
                width: 22px;
                height: 22px;
            }
            .btn-icon {
                width: 30px;
                height: 30px;
                font-size: 12px;
                border-radius: 8px;
            }
            footer.game-footer {
                font-size: 10px;
            }
        }

        @media (max-height: 600px) {
            header.game-header {
                gap: 4px;
            }
            footer.game-footer {
                display: none;
            }
        }

        .overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 900;
            margin: 0 0 4px 0;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .modal-title.danger {
            color: #f87171;
            text-shadow: 0 0 16px rgba(239, 68, 68, 0.6);
        }

        .modal-desc {
            color: var(--muted);
            font-size: 11.5px;
            margin: 0 0 10px 0;
        }

        .score-recap {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 10px;
            margin-bottom: 12px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .recap-item {
            text-align: center;
        }

        .recap-label {
            font-size: 9.5px;
            color: var(--muted);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .recap-val {
            font-size: 17px;
            font-weight: 900;
            color: #fff;
            margin-top: 2px;
        }

        .recap-val.highlight {
            color: var(--accent);
            text-shadow: 0 0 10px rgba(110, 231, 183, 0.4);
        }

        .highest-planet-box {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #10b981, #06b6d4);
            color: #032b28;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 0.5px;
            border: none;
            padding: 11px 16px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .btn-primary:active {
            transform: scale(0.97);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        /* Evolution Chart Modal */
        .tier-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 220px;
            overflow-y: auto;
            margin-bottom: 14px;
            padding-right: 4px;
        }

        .tier-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 12px;
            text-align: left;
        }

        .tier-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 8px currentColor;
        }

        .tier-name {
            font-weight: 700;
            font-size: 13px;
            flex: 1;
        }

        .tier-pts {
            font-weight: 800;
            font-size: 12px;
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <!-- Top Bar -->
        <header class="game-header">
            <div class="brand-pill">
                <div class="brand-icon">🪐</div>
                <div class="brand-title">COSMIC MERGE</div>
            </div>

            <div class="stats-group">
                <div class="stat-card">
                    <div class="stat-label">SCORE</div>
                    <div class="stat-value" id="score-val">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">RECORD</div>
                    <div class="stat-value" id="best-val">0</div>
                </div>
                <div class="next-preview-card" title="Upcoming Celestial Body">
                    <div class="stat-label">NEXT</div>
                    <canvas class="next-preview-canvas" id="nextCanvas" width="52" height="52"></canvas>
                </div>
            </div>

            <button class="btn-icon" id="sound-btn" title="Toggle Sound" aria-label="Toggle Sound">🔊</button>
        </header>

        <!-- Canvas Simulation Area -->
        <div id="canvas-container">
            <canvas id="simCanvas"></canvas>
        </div>

        <!-- Footer Info -->
        <footer class="game-footer">
            <div class="footer-tip">
                <span>⚡ Drag / Arrows to aim • Release / Space to drop</span>
            </div>
            <button class="tier-evolution-btn" id="chart-btn">Celestial Tiers</button>
        </footer>
    </div>

    <!-- Game Over Overlay -->
    <div class="overlay" id="game-over-overlay">
        <div class="modal-card">
            <h2 class="modal-title danger">CONTAINMENT BREACH</h2>
            <p class="modal-desc">Mass accumulation breached the safety threshold.</p>

            <div class="score-recap">
                <div class="recap-item">
                    <div class="recap-label">FINAL SCORE</div>
                    <div class="recap-val highlight" id="final-score">0</div>
                </div>
                <div class="recap-item">
                    <div class="recap-label">HIGH SCORE</div>
                    <div class="recap-val" id="final-best">0</div>
                </div>
                <div class="highest-planet-box">
                    <span style="font-size:11px; color:var(--muted); font-weight:700;">PEAK TIER:</span>
                    <span id="peak-tier-name" style="font-weight:900; font-size:13px; color:var(--accent-2);">Terra</span>
                </div>
            </div>

            <button class="btn-primary" id="retry-btn">REINITIALIZE CHAMBER</button>
        </div>
    </div>

    <!-- Tier Chart Overlay -->
    <div class="overlay" id="chart-overlay">
        <div class="modal-card" style="max-width: 320px;">
            <h2 class="modal-title" style="color:var(--accent-2);">CELESTIAL TIERS</h2>
            <p class="modal-desc">Collide two identical bodies to fuse into the next tier.</p>

            <div class="tier-list" id="tier-list-container">
                <!-- Injected via JavaScript -->
            </div>

            <button class="btn-primary" id="close-chart-btn" style="padding:10px 16px; font-size:13px;">RETURN TO GAME</button>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        // --- Celestial Tiers Configuration ---
        const TIERS = [
            {
                name: "Space Pebble",
                radius: 14,
                score: 2,
                color: "#94a3b8",
                glow: "rgba(148, 163, 184, 0.4)",
                details: "rock"
            },
            {
                name: "Iron Meteor",
                radius: 20,
                score: 4,
                color: "#c2410c",
                glow: "rgba(194, 65, 12, 0.4)",
                details: "crater"
            },
            {
                name: "Frost Comet",
                radius: 26,
                score: 8,
                color: "#38bdf8",
                glow: "rgba(56, 189, 248, 0.5)",
                details: "ice"
            },
            {
                name: "Pluto Dwarf",
                radius: 34,
                score: 16,
                color: "#a855f7",
                glow: "rgba(168, 85, 247, 0.5)",
                details: "dwarf"
            },
            {
                name: "Lunar Moon",
                radius: 42,
                score: 32,
                color: "#e2e8f0",
                glow: "rgba(226, 232, 240, 0.5)",
                details: "luna"
            },
            {
                name: "Crimson Mars",
                radius: 50,
                score: 64,
                color: "#ef4444",
                glow: "rgba(239, 68, 68, 0.55)",
                details: "mars"
            },
            {
                name: "Terra Prime",
                radius: 60,
                score: 128,
                color: "#10b981",
                glow: "rgba(16, 185, 129, 0.6)",
                details: "terra"
            },
            {
                name: "Ringed Saturn",
                radius: 72,
                score: 256,
                color: "#f59e0b",
                glow: "rgba(245, 158, 11, 0.6)",
                details: "saturn"
            },
            {
                name: "Jovian Colossus",
                radius: 84,
                score: 512,
                color: "#f97316",
                glow: "rgba(249, 115, 22, 0.65)",
                details: "jupiter"
            },
            {
                name: "Solar Core",
                radius: 98,
                score: 1024,
                color: "#fbbf24",
                glow: "rgba(251, 191, 36, 0.8)",
                details: "sun"
            },
            {
                name: "Singularity",
                radius: 114,
                score: 2048,
                color: "#6366f1",
                glow: "rgba(99, 102, 241, 0.9)",
                details: "blackhole"
            }
        ];

        // --- Sound Engine (Web Audio API Synthesizer) ---
        class SoundFX {
            constructor() {
                this.enabled = true;
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTone(freq, type, duration, gainStart, gainEnd) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const now = this.ctx.currentTime;

                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);

                gain.gain.setValueAtTime(gainStart, now);
                gain.gain.exponentialRampToValueAtTime(Math.max(gainEnd, 0.0001), now + duration);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + duration);
            }

            drop() {
                this.playTone(260, 'sine', 0.12, 0.15, 0.01);
            }

            merge(tierIndex) {
                const baseFreq = 220 + tierIndex * 48;
                this.playTone(baseFreq, 'triangle', 0.22, 0.35, 0.01);
                setTimeout(() => {
                    this.playTone(baseFreq * 1.5, 'sine', 0.28, 0.25, 0.01);
                }, 40);
            }

            supernova() {
                this.playTone(120, 'sawtooth', 0.6, 0.4, 0.01);
                setTimeout(() => this.playTone(480, 'sine', 0.8, 0.5, 0.001), 100);
            }

            gameOver() {
                this.playTone(180, 'sawtooth', 0.5, 0.4, 0.01);
                setTimeout(() => this.playTone(130, 'sawtooth', 0.7, 0.35, 0.01), 200);
            }
        }

        const sound = new SoundFX();

        // --- DOM Elements ---
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        const scoreEl = document.getElementById('score-val');
        const bestEl = document.getElementById('best-val');
        const finalScoreEl = document.getElementById('final-score');
        const finalBestEl = document.getElementById('final-best');
        const peakTierEl = document.getElementById('peak-tier-name');
        const gameOverOverlay = document.getElementById('game-over-overlay');
        const chartOverlay = document.getElementById('chart-overlay');
        const retryBtn = document.getElementById('retry-btn');
        const soundBtn = document.getElementById('sound-btn');
        const chartBtn = document.getElementById('chart-btn');
        const closeChartBtn = document.getElementById('close-chart-btn');
        const tierListContainer = document.getElementById('tier-list-container');

        // Populate Tier List in Chart
        TIERS.forEach((t, i) => {
            const row = document.createElement('div');
            row.className = 'tier-row';
            row.innerHTML = `
                <div class="tier-dot" style="background:${t.color}; color:${t.color};"></div>
                <div class="tier-name">${i + 1}. ${t.name}</div>
                <div class="tier-pts">+${t.score} PTS</div>
            `;
            tierListContainer.appendChild(row);
        });

        // --- Game Simulation State ---
        let width = 400;
        let height = 600;
        let dpr = 1;

        let bodies = [];
        let particles = [];
        let popups = [];
        let shockwaves = [];

        let score = 0;
        let bestScore = parseInt(localStorage.getItem('cosmicMergeBest') || '0', 10);
        bestEl.textContent = bestScore;

        let maxTierReached = 0;
        let isGameOver = false;

        // Dropper state
        let currentTier = 0;
        let nextTier = 0;
        let dropperX = 200;
        let canDrop = true;
        let dropCooldown = 0;
        let isAiming = false;

        // Danger line
        let DANGER_Y = 100;
        let dangerTimer = 0;
        const DANGER_LIMIT = 2.2; // seconds allowed above danger line
        let radiusScale = 1.0;

        function getTierRadius(tier) {
            return Math.max(10, Math.round(TIERS[tier].radius * radiusScale));
        }

        // Physics constants
        const GRAVITY = 1500; // px/s^2
        const RESTITUTION = 0.28; // bounciness
        const FRICTION = 0.985; // surface friction
        const AIR_DRAG = 0.998;

        // Screen Shake
        let shakeTime = 0;
        let shakeIntensity = 0;

        // --- Responsive Viewport Resize ---
        function resize() {
            dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2.5));
            const vw = window.innerWidth || document.documentElement.clientWidth || 360;
            const vh = window.innerHeight || document.documentElement.clientHeight || 640;

            // Header (~48px) + Footer/Margins (~34px) = ~82px
            const maxAllowedHeight = Math.max(280, vh - 90);
            const maxAllowedWidth = Math.max(240, Math.min(vw - 16, 440));

            width = maxAllowedWidth;
            height = maxAllowedHeight;

            radiusScale = Math.min(1.0, Math.max(0.70, width / 400));
            DANGER_Y = Math.max(70, Math.floor(height * 0.16));

            container.style.width = width + 'px';
            container.style.height = height + 'px';

            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            // Clamp dropper within bounds
            clampDropperX();
        }

        window.addEventListener('resize', resize);
        window.addEventListener('orientationchange', () => setTimeout(resize, 100));
        window.addEventListener('load', resize);

        function clampDropperX() {
            const r = getTierRadius(currentTier);
            const pad = 12;
            if (dropperX < r + pad) dropperX = r + pad;
            if (dropperX > width - r - pad) dropperX = width - r - pad;
        }

        // --- Body Construction ---
        let nextBodyId = 1;
        class CelestialBody {
            constructor(x, y, tier, vx = 0, vy = 0) {
                this.id = nextBodyId++;
                this.x = x;
                this.y = y;
                this.tier = tier;
                this.radius = getTierRadius(tier);
                this.vx = vx;
                this.vy = vy;
                this.mass = Math.PI * this.radius * this.radius;
                this.merging = false;
                this.spawnScale = 0.4;
                this.rot = Math.random() * Math.PI * 2;
                this.vRot = (Math.random() - 0.5) * 1.5;
                this.settled = false;
                this.timeAlive = 0;
            }

            update(dt) {
                this.timeAlive += dt;
                // Animate pop-in scale
                if (this.spawnScale < 1) {
                    this.spawnScale = Math.min(1, this.spawnScale + dt * 6.5);
                }

                this.rot += this.vRot * dt;

                // Apply gravity
                this.vy += GRAVITY * dt;

                // Air drag
                this.vx *= AIR_DRAG;
                this.vy *= AIR_DRAG;

                this.x += this.vx * dt;
                this.y += this.vy * dt;

                const curR = this.radius * this.spawnScale;
                const pad = 6;

                // Left & Right Wall Collisions
                if (this.x - curR < pad) {
                    this.x = curR + pad;
                    this.vx = -this.vx * RESTITUTION;
                    this.vRot = -this.vy * 0.04;
                } else if (this.x + curR > width - pad) {
                    this.x = width - curR - pad;
                    this.vx = -this.vx * RESTITUTION;
                    this.vRot = this.vy * 0.04;
                }

                // Floor Collision
                if (this.y + curR > height - pad) {
                    this.y = height - curR - pad;
                    this.vy = -this.vy * RESTITUTION;
                    this.vx *= FRICTION;
                    if (Math.abs(this.vy) < 30) this.vy = 0;
                    this.settled = true;
                }

                // Check speed
                if (Math.abs(this.vx) < 4 && Math.abs(this.vy) < 4) {
                    this.settled = true;
                }
            }

            draw(ctx) {
                const config = TIERS[this.tier];
                const r = this.radius * this.spawnScale;

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rot);

                // Planet Glow Aura
                ctx.beginPath();
                ctx.arc(0, 0, r + 4, 0, Math.PI * 2);
                ctx.fillStyle = config.glow;
                ctx.fill();

                // Planet Base Gradient
                const g = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.1, 0, 0, r);
                g.addColorStop(0, '#ffffff');
                g.addColorStop(0.25, config.color);
                g.addColorStop(1, '#05070d');

                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.fillStyle = g;
                ctx.fill();

                // Procedural Planet Details
                this.drawPlanetDetails(ctx, config.details, r);

                // Planet Specular Rim Highlight
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.restore();
            }

            drawPlanetDetails(ctx, style, r) {
                ctx.save();
                ctx.clip();

                if (style === 'crater') {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
                    ctx.beginPath();
                    ctx.arc(-r * 0.3, -r * 0.2, r * 0.22, 0, Math.PI * 2);
                    ctx.arc(r * 0.35, r * 0.2, r * 0.18, 0, Math.PI * 2);
                    ctx.arc(-r * 0.1, r * 0.4, r * 0.14, 0, Math.PI * 2);
                    ctx.fill();
                } else if (style === 'ice') {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(-r * 0.6, -r * 0.4);
                    ctx.lineTo(r * 0.2, -r * 0.1);
                    ctx.lineTo(-r * 0.1, r * 0.5);
                    ctx.stroke();
                } else if (style === 'mars') {
                    // Rust bands and polar cap
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.beginPath();
                    ctx.arc(0, -r * 0.75, r * 0.3, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
                    ctx.fillRect(-r, -r * 0.1, r * 2, r * 0.25);
                } else if (style === 'terra') {
                    // Continents & clouds
                    ctx.fillStyle = '#10b981';
                    ctx.beginPath();
                    ctx.arc(-r * 0.3, -r * 0.1, r * 0.38, 0, Math.PI * 2);
                    ctx.arc(r * 0.25, r * 0.25, r * 0.32, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.arc(0, 0, r * 0.6, 0.3, 2.2);
                    ctx.stroke();
                } else if (style === 'saturn') {
                    // Atmospheric bands
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                    ctx.fillRect(-r, -r * 0.35, r * 2, r * 0.18);
                    ctx.fillRect(-r, r * 0.15, r * 2, r * 0.2);

                    // Rings outside clip handled separately in unclipped pass
                } else if (style === 'jupiter') {
                    // Gas giant bands and Great Red Spot
                    ctx.fillStyle = 'rgba(120, 30, 10, 0.35)';
                    ctx.fillRect(-r, -r * 0.4, r * 2, r * 0.22);
                    ctx.fillRect(-r, r * 0.1, r * 2, r * 0.25);

                    ctx.fillStyle = '#dc2626';
                    ctx.beginPath();
                    ctx.ellipse(r * 0.3, r * 0.22, r * 0.22, r * 0.14, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else if (style === 'sun') {
                    // Solar flares
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(0, 0, r * 0.45, 0, Math.PI * 2);
                    ctx.fill();
                } else if (style === 'blackhole') {
                    // Event horizon & vortex
                    ctx.fillStyle = '#000000';
                    ctx.beginPath();
                    ctx.arc(0, 0, r * 0.7, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = '#a855f7';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(0, 0, r * 0.8, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.restore();

                // Extra ring for Saturn
                if (style === 'saturn') {
                    ctx.save();
                    ctx.rotate(0.35);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, r * 1.55, r * 0.4, 0, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(251, 191, 36, 0.85)';
                    ctx.lineWidth = 4.5;
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.ellipse(0, 0, r * 1.75, r * 0.45, 0, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(245, 158, 11, 0.4)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.restore();
                }
            }
        }

        // --- Visual Effects Classes ---
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = 60 + Math.random() * 220;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.color = color;
                this.radius = 2 + Math.random() * 3.5;
                this.life = 1.0;
                this.decay = 1.2 + Math.random() * 1.5;
            }

            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.vx *= 0.96;
                this.vy *= 0.96;
                this.life -= this.decay * dt;
            }

            draw(ctx) {
                if (this.life <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Shockwave {
            constructor(x, y, maxR, color) {
                this.x = x;
                this.y = y;
                this.r = 6;
                this.maxR = maxR;
                this.color = color;
                this.life = 1.0;
            }

            update(dt) {
                this.r += (this.maxR - this.r) * dt * 9;
                this.life -= dt * 2.2;
            }

            draw(ctx) {
                if (this.life <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life * 0.8);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3 * this.life;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }

        class ScorePopup {
            constructor(x, y, pts) {
                this.x = x;
                this.y = y;
                this.pts = pts;
                this.life = 1.0;
            }

            update(dt) {
                this.y -= dt * 50;
                this.life -= dt * 1.5;
            }

            draw(ctx) {
                if (this.life <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = '#6ee7b7';
                ctx.font = 'bold 15px Outfit, sans-serif';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#10b981';
                ctx.shadowBlur = 10;
                ctx.fillText(`+${this.pts}`, this.x, this.y);
                ctx.restore();
            }
        }

        // --- Physics Engine & Collisions ---
        function resolvePhysics(dt) {
            const SUB_STEPS = 4;
            const subDt = dt / SUB_STEPS;

            for (let step = 0; step < SUB_STEPS; step++) {
                // Update position
                for (let i = 0; i < bodies.length; i++) {
                    bodies[i].update(subDt);
                }

                // Circle vs Circle collisions
                for (let i = 0; i < bodies.length; i++) {
                    const b1 = bodies[i];
                    if (b1.merging) continue;

                    for (let j = i + 1; j < bodies.length; j++) {
                        const b2 = bodies[j];
                        if (b2.merging) continue;

                        const dx = b2.x - b1.x;
                        const dy = b2.y - b1.y;
                        const distSq = dx * dx + dy * dy;
                        const rSum = (b1.radius * b1.spawnScale) + (b2.radius * b2.spawnScale);

                        if (distSq < rSum * rSum && distSq > 0.0001) {
                            const dist = Math.sqrt(distSq);
                            const nx = dx / dist;
                            const ny = dy / dist;

                            // Check tier match for Merge
                            if (b1.tier === b2.tier && b1.spawnScale >= 0.9 && b2.spawnScale >= 0.9) {
                                triggerMerge(b1, b2);
                                continue;
                            }

                            // Positional overlap resolution (separation)
                            const overlap = rSum - dist;
                            const totalMass = b1.mass + b2.mass;
                            const m1Ratio = b2.mass / totalMass;
                            const m2Ratio = b1.mass / totalMass;

                            b1.x -= nx * overlap * m1Ratio;
                            b1.y -= ny * overlap * m1Ratio;
                            b2.x += nx * overlap * m2Ratio;
                            b2.y += ny * overlap * m2Ratio;

                            // Velocity impulse along collision normal
                            const kx = b1.vx - b2.vx;
                            const ky = b1.vy - b2.vy;
                            const p = 2 * (nx * kx + ny * ky) / totalMass;

                            const impulseRestitution = 1 + RESTITUTION;
                            b1.vx -= p * b2.mass * nx * impulseRestitution;
                            b1.vy -= p * b2.mass * ny * impulseRestitution;
                            b2.vx += p * b1.mass * nx * impulseRestitution;
                            b2.vy += p * b1.mass * ny * impulseRestitution;

                            // Tangential friction
                            b1.vx *= FRICTION;
                            b2.vx *= FRICTION;
                        }
                    }
                }
            }

            // Cleanup merged bodies
            bodies = bodies.filter(b => !b.merging);
        }

        // --- Merge Trigger ---
        function triggerMerge(b1, b2) {
            b1.merging = true;
            b2.merging = true;

            const midX = (b1.x + b2.x) / 2;
            const midY = (b1.y + b2.y) / 2;
            const nextTierIndex = b1.tier + 1;

            // Spawn fusion effects
            const config = TIERS[b1.tier];
            sound.merge(b1.tier);

            // Screen shake
            shakeTime = 0.2;
            shakeIntensity = 2 + b1.tier * 0.8;

            // Particles
            const pCount = 14 + b1.tier * 2;
            for (let i = 0; i < pCount; i++) {
                particles.push(new Particle(midX, midY, config.color));
            }
            shockwaves.push(new Shockwave(midX, midY, config.radius * 2.8, config.color));

            // Check if Supernova (two Black Holes merged)
            if (nextTierIndex >= TIERS.length) {
                sound.supernova();
                addScore(10000);
                popups.push(new ScorePopup(midX, midY - 20, 10000));
                shakeTime = 0.6;
                shakeIntensity = 12;

                // Supernova explosion: clear half the chamber debris
                shockwaves.push(new Shockwave(midX, midY, width, '#ffffff'));
                for (let i = 0; i < 40; i++) {
                    particles.push(new Particle(midX, midY, '#c084fc'));
                }
                bodies.forEach(b => {
                    if (Math.hypot(b.x - midX, b.y - midY) < 180) {
                        b.merging = true;
                    }
                });
                return;
            }

            // Standard fusion: spawn next tier
            const newBody = new CelestialBody(midX, midY, nextTierIndex, 0, -30);
            bodies.push(newBody);

            if (nextTierIndex > maxTierReached) {
                maxTierReached = nextTierIndex;
            }

            const pts = TIERS[nextTierIndex].score;
            addScore(pts);
            popups.push(new ScorePopup(midX, midY - 20, pts));
        }

        function addScore(pts) {
            score += pts;
            scoreEl.textContent = score;
            if (score > bestScore) {
                bestScore = score;
                bestEl.textContent = bestScore;
                localStorage.setItem('cosmicMergeBest', bestScore);
            }
        }

        // --- Danger & Game Over Check ---
        function checkDangerLine(dt) {
            let isOverDanger = false;

            for (let i = 0; i < bodies.length; i++) {
                const b = bodies[i];
                // Only count bodies that have settled or been alive for a bit
                if (b.timeAlive > 1.2 && b.y - b.radius < DANGER_Y) {
                    isOverDanger = true;
                    break;
                }
            }

            if (isOverDanger) {
                dangerTimer += dt;
                if (dangerTimer >= DANGER_LIMIT && !isGameOver) {
                    triggerGameOver();
                }
            } else {
                dangerTimer = Math.max(0, dangerTimer - dt * 1.5);
            }
        }

        function triggerGameOver() {
            isGameOver = true;
            sound.gameOver();

            finalScoreEl.textContent = score;
            finalBestEl.textContent = bestScore;
            peakTierEl.textContent = TIERS[maxTierReached].name;
            peakTierEl.style.color = TIERS[maxTierReached].color;

            gameOverOverlay.classList.add('active');
        }

        // --- Dropper Actions ---
        function dropCurrentBody() {
            if (!canDrop || isGameOver || dropCooldown > 0) return;

            sound.drop();
            const r = getTierRadius(currentTier);
            const startY = DANGER_Y - 20;

            const newBody = new CelestialBody(dropperX, startY, currentTier, 0, 40);
            bodies.push(newBody);

            canDrop = false;
            dropCooldown = 0.55;

            // Advance tiers
            currentTier = nextTier;
            nextTier = getRandomSpawnTier();
            drawNextPreview();
            clampDropperX();
        }

        function getRandomSpawnTier() {
            // Drop small beginner tiers: mostly 0, 1, 2, rare 3
            const rand = Math.random();
            if (rand < 0.45) return 0;
            if (rand < 0.78) return 1;
            if (rand < 0.94) return 2;
            return 3;
        }

        function drawNextPreview() {
            const config = TIERS[nextTier];
            nextCtx.clearRect(0, 0, 52, 52);

            const r = Math.min(20, Math.round(config.radius * 0.65 * radiusScale));
            nextCtx.save();
            nextCtx.translate(26, 26);

            // Glow
            nextCtx.beginPath();
            nextCtx.arc(0, 0, r + 2, 0, Math.PI * 2);
            nextCtx.fillStyle = config.glow;
            nextCtx.fill();

            // Gradient
            const g = nextCtx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
            g.addColorStop(0, '#ffffff');
            g.addColorStop(0.3, config.color);
            g.addColorStop(1, '#05070d');
            nextCtx.fillStyle = g;
            nextCtx.beginPath();
            nextCtx.arc(0, 0, r, 0, Math.PI * 2);
            nextCtx.fill();

            nextCtx.restore();
        }

        // --- Input Handling (Dual Controls: Touch, Mouse, Keyboard) ---
        function handlePointerMove(clientX) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = width / rect.width;
            dropperX = (clientX - rect.left) * scaleX;
            clampDropperX();
        }

        // Touch & Mouse Pointer Events with Pointer Capture
        canvas.addEventListener('pointerdown', (e) => {
            if (isGameOver) return;
            try {
                canvas.setPointerCapture(e.pointerId);
            } catch (_) {}
            sound.init();
            isAiming = true;
            handlePointerMove(e.clientX);
            e.preventDefault();
        });

        window.addEventListener('pointermove', (e) => {
            if (isAiming) {
                handlePointerMove(e.clientX);
                e.preventDefault();
            }
        });

        window.addEventListener('pointerup', (e) => {
            if (isAiming) {
                try {
                    canvas.releasePointerCapture(e.pointerId);
                } catch (_) {}
                isAiming = false;
                dropCurrentBody();
                e.preventDefault();
            }
        });

        window.addEventListener('pointercancel', (e) => {
            if (isAiming) {
                try {
                    canvas.releasePointerCapture(e.pointerId);
                } catch (_) {}
                isAiming = false;
            }
        });

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            sound.init();

            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                dropperX -= 24;
                clampDropperX();
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                dropperX += 24;
                clampDropperX();
            } else if (e.key === ' ' || e.key === 'ArrowDown' || e.key === 's' || e.key === 'S' || e.key === 'Enter') {
                e.preventDefault();
                dropCurrentBody();
            }
        });

        // UI Buttons
        soundBtn.addEventListener('click', () => {
            sound.enabled = !sound.enabled;
            soundBtn.textContent = sound.enabled ? '🔊' : '🔇';
        });

        chartBtn.addEventListener('click', () => {
            chartOverlay.classList.add('active');
        });

        closeChartBtn.addEventListener('click', () => {
            chartOverlay.classList.remove('active');
        });

        // Android Bridge & Retry Logic
        function restartWithAd() {
            if (window.Android && window.Android.showAd) {
                window.Android.showAd();
            } else {
                console.warn("Android interface not available, restarting directly.");
                window.restartGame();
            }
        }

        retryBtn.addEventListener('click', restartWithAd);

        // Standard Global Callback for Android
        window.restartGame = function () {
            initGame();
        };

        // --- Render Loop ---
        let lastTime = 0;

        function render(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = Math.min((timestamp - lastTime) / 1000, 0.033);
            lastTime = timestamp;

            // Handle drop cooldown
            if (dropCooldown > 0) {
                dropCooldown -= dt;
                if (dropCooldown <= 0) canDrop = true;
            }

            // Step Physics & Rules
            if (!isGameOver) {
                resolvePhysics(dt);
                checkDangerLine(dt);
            }

            // Update VFX
            particles.forEach(p => p.update(dt));
            particles = particles.filter(p => p.life > 0);

            shockwaves.forEach(s => s.update(dt));
            shockwaves = shockwaves.filter(s => s.life > 0);

            popups.forEach(p => p.update(dt));
            popups = popups.filter(p => p.life > 0);

            // Handle Screen Shake
            ctx.save();
            if (shakeTime > 0) {
                shakeTime -= dt;
                const ox = (Math.random() - 0.5) * shakeIntensity;
                const oy = (Math.random() - 0.5) * shakeIntensity;
                ctx.translate(ox, oy);
            }

            // Background Chamber Canvas
            ctx.clearRect(0, 0, width, height);

            // Chamber Grid Backdrop
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.025)';
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x < width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = 0; y < height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            // Danger Line
            const isDangerActive = dangerTimer > 0;
            const dangerAlpha = isDangerActive ? (0.4 + Math.sin(timestamp * 0.01) * 0.35) : 0.2;
            ctx.strokeStyle = isDangerActive ? `rgba(239, 68, 68, ${dangerAlpha})` : 'rgba(255, 255, 255, 0.12)';
            ctx.lineWidth = isDangerActive ? 2.5 : 1.5;
            ctx.setLineDash([8, 6]);
            ctx.beginPath();
            ctx.moveTo(8, DANGER_Y);
            ctx.lineTo(width - 8, DANGER_Y);
            ctx.stroke();
            ctx.setLineDash([]);

            if (isDangerActive) {
                ctx.fillStyle = `rgba(239, 68, 68, ${dangerAlpha * 1.5})`;
                ctx.font = 'bold 10px Outfit, sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(`CONTAINMENT WARNING ${(DANGER_LIMIT - dangerTimer).toFixed(1)}s`, width - 14, DANGER_Y - 6);
            }

            // Draw Celestial Bodies
            bodies.forEach(b => b.draw(ctx));

            // Draw Shockwaves & Particles
            shockwaves.forEach(s => s.draw(ctx));
            particles.forEach(p => p.draw(ctx));
            popups.forEach(p => p.draw(ctx));

            // Dropper Laser Guide & Preview Planet
            if (canDrop && !isGameOver) {
                const config = TIERS[currentTier];

                // Guide Line
                ctx.strokeStyle = 'rgba(110, 231, 183, 0.25)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(dropperX, 24);
                ctx.lineTo(dropperX, height - 10);
                ctx.stroke();
                ctx.setLineDash([]);

                // Dropper Body Preview
                ctx.save();
                ctx.translate(dropperX, DANGER_Y - 20);

                ctx.beginPath();
                ctx.arc(0, 0, config.radius + 3, 0, Math.PI * 2);
                ctx.fillStyle = config.glow;
                ctx.fill();

                const pg = ctx.createRadialGradient(-config.radius * 0.3, -config.radius * 0.3, 2, 0, 0, config.radius);
                pg.addColorStop(0, '#ffffff');
                pg.addColorStop(0.3, config.color);
                pg.addColorStop(1, '#05070d');
                ctx.fillStyle = pg;
                ctx.beginPath();
                ctx.arc(0, 0, config.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            ctx.restore();
            requestAnimationFrame(render);
        }

        // --- Game Initialization ---
        function initGame() {
            bodies = [];
            particles = [];
            popups = [];
            shockwaves = [];
            score = 0;
            scoreEl.textContent = '0';
            maxTierReached = 0;
            isGameOver = false;
            dangerTimer = 0;
            canDrop = true;
            dropCooldown = 0;

            gameOverOverlay.classList.remove('active');
            chartOverlay.classList.remove('active');

            currentTier = getRandomSpawnTier();
            nextTier = getRandomSpawnTier();
            dropperX = width / 2;

            drawNextPreview();
            clampDropperX();
        }

        // Boot
        resize();
