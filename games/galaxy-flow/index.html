<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galaxy Flow — Game Galaxy</title>

    <!-- Standard favicon -->
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
    <!-- PNG favicons -->
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <!-- Android / Chrome icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="assets/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/android-chrome-512x512.png">
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #070b1a;
            --panel: rgba(15, 23, 42, 0.75);
            --border: rgba(255, 255, 255, 0.12);
            --accent: #38bdf8;
            --accent-green: #34d399;
            --accent-amber: #fbbf24;
            --accent-purple: #c084fc;
            --text: #f1f5f9;
            --muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg);
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        #game-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: radial-gradient(circle at 50% 15%, #132247 0%, #070b1a 80%);
            padding: 6px 8px;
            box-sizing: border-box;
        }

        /* Top Header UI */
        header.game-header {
            width: 100%;
            max-width: 440px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            z-index: 10;
        }

        .brand-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--panel);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 14px;
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: linear-gradient(135deg, #06b6d4, #a855f7);
            display: grid;
            place-items: center;
            font-weight: 900;
            font-size: 14px;
            color: #fff;
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.4);
        }

        .brand-title {
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #e2e8f0, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-icon {
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: transform 0.1s, background 0.2s;
        }

        .btn-icon:active {
            transform: scale(0.92);
        }

        /* Stats Subheader */
        .stats-bar {
            width: 100%;
            max-width: 440px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--panel);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 5px 14px;
            font-size: 13px;
            font-weight: 700;
            z-index: 10;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-value {
            font-weight: 800;
            color: #fff;
        }

        /* Canvas Board Container */
        #board-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto 0;
            flex-shrink: 0;
        }

        canvas#flowCanvas {
            display: block;
            border-radius: 20px;
            border: 1.5px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.15), inset 0 0 30px rgba(0, 0, 0, 0.6);
            touch-action: none;
            background: #080d22;
        }

        /* Footer Controls */
        footer.game-footer {
            width: 100%;
            max-width: 440px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--muted);
            padding: 0 4px;
            z-index: 10;
        }

        .sector-badge {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Modals & Overlays */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 7, 18, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: linear-gradient(180deg, rgba(23, 37, 84, 0.96), rgba(15, 23, 42, 0.98));
            border: 1px solid rgba(56, 189, 248, 0.35);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 24px rgba(56, 189, 248, 0.2);
            border-radius: 18px;
            padding: 18px 16px;
            width: 90%;
            max-width: 320px;
            flex-shrink: 0;
            box-sizing: border-box;
            text-align: center;
            transform: scale(0.92);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @media (max-width: 420px) {
            .brand-title {
                display: none;
            }
            .brand-pill {
                padding: 4px 8px;
            }
            .brand-icon {
                width: 24px;
                height: 24px;
                font-size: 12px;
            }
            .stats-bar {
                padding: 4px 10px;
                font-size: 11px;
            }
            .btn-icon {
                width: 28px;
                height: 28px;
                font-size: 12px;
            }
            .sector-badge {
                padding: 3px 8px;
                font-size: 10px;
            }
        }

        @media (max-height: 620px) {
            #game-wrapper {
                padding: 4px 8px 8px 8px;
            }
            footer.game-footer {
                display: none;
            }
        }

        .overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 900;
            margin: 0 0 4px 0;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .modal-title.victory {
            color: #34d399;
            text-shadow: 0 0 16px rgba(52, 211, 153, 0.6);
        }

        .modal-desc {
            color: var(--muted);
            font-size: 11.5px;
            margin: 0 0 10px 0;
        }

        .score-recap {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 10px;
            margin-bottom: 12px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .recap-item {
            text-align: center;
        }

        .recap-label {
            font-size: 9.5px;
            color: var(--muted);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .recap-val {
            font-size: 17px;
            font-weight: 900;
            color: #fff;
            margin-top: 2px;
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #10b981, #06b6d4);
            color: #050814;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 0.5px;
            border: none;
            padding: 11px 16px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .btn-primary:active {
            transform: scale(0.97);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        /* Level Selector Grid */
        .levels-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 12px;
            max-height: 200px;
            overflow-y: auto;
            padding: 2px;
        }

        .level-btn {
            background: rgba(15, 23, 48, 0.85);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-weight: 800;
            font-size: 13px;
            padding: 10px 0;
            cursor: pointer;
            transition: all 0.15s;
        }

        .level-btn.active {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.25);
            color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <!-- Top Header -->
        <header class="game-header">
            <div class="brand-pill">
                <div class="brand-icon">⚡</div>
                <div class="brand-title">GALAXY FLOW</div>
            </div>

            <div class="header-actions">
                <button class="btn-icon" id="reset-btn" title="Reset Current Flow">↺</button>
                <button class="btn-icon" id="sound-btn" title="Toggle Sound">🔊</button>
            </div>
        </header>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-item">
                <span style="color:var(--muted)">SECTOR:</span>
                <span class="stat-value" id="sector-display">1 (5×5)</span>
            </div>
            <div class="stat-item">
                <span style="color:var(--muted)">FLOWS:</span>
                <span class="stat-value" id="flows-display" style="color:var(--accent);">0/5</span>
            </div>
            <div class="stat-item">
                <span style="color:var(--muted)">PIPE:</span>
                <span class="stat-value" id="pipe-display" style="color:var(--accent-green);">0%</span>
            </div>
        </div>

        <!-- Canvas Game Arena -->
        <div id="board-container">
            <canvas id="flowCanvas"></canvas>
        </div>

        <!-- Footer -->
        <footer class="game-footer">
            <span>✨ Drag to link matching beacons • Fill all conduits!</span>
            <button class="sector-badge" id="sectors-btn">Select Sector</button>
        </footer>
    </div>

    <!-- Victory Modal -->
    <div class="overlay" id="victory-overlay">
        <div class="modal-card">
            <h2 class="modal-title victory" id="victory-title">SECTOR STABILIZED!</h2>
            <p class="modal-desc" id="victory-desc">All cosmic conduits connected with 100% grid energy coverage.</p>

            <div class="score-recap">
                <div class="recap-item">
                    <div class="recap-label">COVERAGE</div>
                    <div class="recap-val" id="recap-pipe" style="color:#34d399;">100%</div>
                </div>
                <div class="recap-item">
                    <div class="recap-label">FLOWS</div>
                    <div class="recap-val" id="recap-flows" style="color:#38bdf8;">5/5</div>
                </div>
            </div>

            <button class="btn-primary" id="next-level-btn">NEXT SECTOR</button>
        </div>
    </div>

    <!-- Sector Select Modal -->
    <div class="overlay" id="select-overlay">
        <div class="modal-card" style="max-width: 320px;">
            <h2 class="modal-title" style="color:var(--accent);">SELECT SECTOR</h2>
            <p class="modal-desc">Choose an orbital sector to navigate:</p>

            <div class="levels-grid" id="levels-container">
                <!-- Injected via JavaScript -->
            </div>

            <button class="btn-primary" id="close-select-btn" style="padding:10px 16px; font-size:13px;">RESUME</button>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        // --- Sound Engine (Harmonic Audio Synthesizer) ---
        class SoundFX {
            constructor() {
                this.enabled = true;
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTone(freq, type, duration, gainStart, gainEnd = 0.001) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const now = this.ctx.currentTime;

                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);

                gain.gain.setValueAtTime(gainStart, now);
                gain.gain.exponentialRampToValueAtTime(gainEnd, now + duration);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + duration);
            }

            step(colorIdx) {
                const freqs = [330, 392, 440, 494, 523, 587, 659];
                const f = freqs[colorIdx % freqs.length];
                this.playTone(f, 'sine', 0.08, 0.12);
            }

            connect(colorIdx) {
                const freqs = [392, 440, 523, 587, 659, 783, 880];
                const f = freqs[colorIdx % freqs.length];
                this.playTone(f, 'triangle', 0.22, 0.25);
                setTimeout(() => this.playTone(f * 1.5, 'sine', 0.28, 0.18), 40);
            }

            victory() {
                [523, 659, 784, 1046, 1318].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 'triangle', 0.35, 0.3), i * 70);
                });
            }
        }

        const sound = new SoundFX();

        // --- Celestial Colors Palette ---
        const PALETTE = [
            { name: 'cyan', fill: '#06b6d4', glow: 'rgba(6, 182, 212, 0.75)', core: '#ffffff' },
            { name: 'crimson', fill: '#ef4444', glow: 'rgba(239, 68, 68, 0.75)', core: '#ffffff' },
            { name: 'emerald', fill: '#10b981', glow: 'rgba(16, 185, 129, 0.75)', core: '#ffffff' },
            { name: 'amber', fill: '#f59e0b', glow: 'rgba(245, 158, 11, 0.75)', core: '#ffffff' },
            { name: 'purple', fill: '#a855f7', glow: 'rgba(168, 85, 247, 0.75)', core: '#ffffff' },
            { name: 'rose', fill: '#ec4899', glow: 'rgba(236, 72, 153, 0.75)', core: '#ffffff' },
            { name: 'blue', fill: '#3b82f6', glow: 'rgba(59, 130, 246, 0.75)', core: '#ffffff' }
        ];

        // --- 12 Provably Solvable Progressive Sectors ---
        const SECTORS = [
            // Sector 1 (5x5, 5 colors)
            {"size": 5, "pairs": [{"color": 0, "p1": [3, 1], "p2": [1, 1]}, {"color": 1, "p1": [4, 2], "p2": [3, 4]}, {"color": 2, "p1": [1, 0], "p2": [1, 2]}, {"color": 3, "p1": [0, 4], "p2": [3, 3]}, {"color": 4, "p1": [4, 1], "p2": [2, 0]}]},
            // Sector 2 (5x5, 4 colors)
            {"size": 5, "pairs": [{"color": 0, "p1": [4, 0], "p2": [0, 0]}, {"color": 1, "p1": [2, 2], "p2": [4, 4]}, {"color": 2, "p1": [0, 1], "p2": [0, 4]}, {"color": 3, "p1": [1, 2], "p2": [2, 1]}]},
            // Sector 3 (5x5, 5 colors)
            {"size": 5, "pairs": [{"color": 0, "p1": [1, 2], "p2": [0, 2]}, {"color": 1, "p1": [3, 0], "p2": [3, 3]}, {"color": 2, "p1": [2, 1], "p2": [1, 1]}, {"color": 3, "p1": [4, 3], "p2": [2, 4]}, {"color": 4, "p1": [4, 2], "p2": [4, 0]}]},
            // Sector 4 (5x5, 5 colors)
            {"size": 5, "pairs": [{"color": 0, "p1": [2, 1], "p2": [4, 0]}, {"color": 1, "p1": [1, 1], "p2": [1, 0]}, {"color": 2, "p1": [1, 4], "p2": [1, 3]}, {"color": 3, "p1": [3, 2], "p2": [3, 3]}, {"color": 4, "p1": [2, 2], "p2": [4, 4]}]},
            // Sector 5 (6x6, 5 colors)
            {"size": 6, "pairs": [{"color": 0, "p1": [0, 2], "p2": [2, 0]}, {"color": 1, "p1": [4, 1], "p2": [4, 2]}, {"color": 2, "p1": [0, 3], "p2": [3, 3]}, {"color": 3, "p1": [5, 5], "p2": [2, 5]}, {"color": 4, "p1": [2, 1], "p2": [5, 0]}]},
            // Sector 6 (6x6, 5 colors)
            {"size": 6, "pairs": [{"color": 0, "p1": [3, 2], "p2": [2, 4]}, {"color": 1, "p1": [1, 1], "p2": [3, 0]}, {"color": 2, "p1": [5, 0], "p2": [4, 4]}, {"color": 3, "p1": [1, 4], "p2": [2, 2]}, {"color": 4, "p1": [0, 0], "p2": [3, 4]}]},
            // Sector 7 (6x6, 5 colors)
            {"size": 6, "pairs": [{"color": 0, "p1": [5, 2], "p2": [5, 5]}, {"color": 1, "p1": [2, 2], "p2": [2, 3]}, {"color": 2, "p1": [2, 0], "p2": [4, 4]}, {"color": 3, "p1": [5, 0], "p2": [3, 0]}, {"color": 4, "p1": [0, 0], "p2": [2, 5]}]},
            // Sector 8 (6x6, 6 colors)
            {"size": 6, "pairs": [{"color": 0, "p1": [3, 4], "p2": [5, 5]}, {"color": 1, "p1": [4, 1], "p2": [5, 1]}, {"color": 2, "p1": [2, 3], "p2": [2, 5]}, {"color": 3, "p1": [0, 2], "p2": [1, 0]}, {"color": 4, "p1": [1, 3], "p2": [1, 4]}, {"color": 5, "p1": [4, 2], "p2": [2, 2]}]},
            // Sector 9 (7x7, 7 colors)
            {"size": 7, "pairs": [{"color": 0, "p1": [4, 5], "p2": [5, 4]}, {"color": 1, "p1": [1, 6], "p2": [0, 6]}, {"color": 2, "p1": [6, 4], "p2": [6, 0]}, {"color": 3, "p1": [3, 4], "p2": [4, 6]}, {"color": 4, "p1": [6, 6], "p2": [6, 5]}, {"color": 5, "p1": [5, 2], "p2": [0, 0]}, {"color": 6, "p1": [3, 3], "p2": [0, 4]}]},
            // Sector 10 (7x7, 7 colors)
            {"size": 7, "pairs": [{"color": 0, "p1": [5, 0], "p2": [4, 0]}, {"color": 1, "p1": [2, 6], "p2": [4, 4]}, {"color": 2, "p1": [0, 1], "p2": [1, 3]}, {"color": 3, "p1": [1, 5], "p2": [3, 4]}, {"color": 4, "p1": [0, 4], "p2": [1, 6]}, {"color": 5, "p1": [2, 3], "p2": [2, 2]}, {"color": 6, "p1": [6, 6], "p2": [3, 6]}]},
            // Sector 11 (7x7, 6 colors)
            {"size": 7, "pairs": [{"color": 0, "p1": [1, 3], "p2": [1, 0]}, {"color": 1, "p1": [4, 4], "p2": [5, 5]}, {"color": 2, "p1": [5, 4], "p2": [4, 3]}, {"color": 3, "p1": [0, 0], "p2": [0, 5]}, {"color": 4, "p1": [5, 1], "p2": [2, 1]}, {"color": 5, "p1": [0, 6], "p2": [3, 3]}]},
            // Sector 12 (7x7, 6 colors)
            {"size": 7, "pairs": [{"color": 0, "p1": [2, 1], "p2": [3, 6]}, {"color": 1, "p1": [2, 0], "p2": [3, 1]}, {"color": 2, "p1": [2, 6], "p2": [0, 2]}, {"color": 3, "p1": [4, 2], "p2": [5, 6]}, {"color": 4, "p1": [6, 1], "p2": [6, 0]}, {"color": 5, "p1": [1, 0], "p2": [1, 3]}]}
        ];

        // --- DOM Elements ---
        const canvas = document.getElementById('flowCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('board-container');

        const sectorDisplay = document.getElementById('sector-display');
        const flowsDisplay = document.getElementById('flows-display');
        const pipeDisplay = document.getElementById('pipe-display');
        const recapFlows = document.getElementById('recap-flows');
        const recapPipe = document.getElementById('recap-pipe');
        const victoryTitle = document.getElementById('victory-title');
        const victoryDesc = document.getElementById('victory-desc');

        const resetBtn = document.getElementById('reset-btn');
        const soundBtn = document.getElementById('sound-btn');
        const sectorsBtn = document.getElementById('sectors-btn');
        const nextLevelBtn = document.getElementById('next-level-btn');
        const closeSelectBtn = document.getElementById('close-select-btn');

        const victoryOverlay = document.getElementById('victory-overlay');
        const selectOverlay = document.getElementById('select-overlay');
        const levelsContainer = document.getElementById('levels-container');

        // Build Levels Grid
        SECTORS.forEach((s, idx) => {
            const btn = document.createElement('button');
            btn.className = `level-btn ${idx === 0 ? 'active' : ''}`;
            btn.textContent = `${idx + 1} (${s.size}×${s.size})`;
            btn.onclick = () => {
                currentSectorIdx = idx;
                initSector();
                selectOverlay.classList.remove('active');
            };
            levelsContainer.appendChild(btn);
        });

        // --- Game State ---
        let currentSectorIdx = 0;
        let gridSize = 5;
        let pairs = []; // { color, p1, p2 }
        let paths = {}; // colorIdx -> array of [r, c]
        let activeColor = null;
        let isDrawing = false;
        let lastCell = null;

        let boardWidth = 360;
        let cellSize = boardWidth / gridSize;
        let dpr = 1;

        // Visual Particles & Pulses
        let particles = [];
        let isVictory = false;

        // --- Viewport Resize ---
        function resize() {
            dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2.5));
            const vw = window.innerWidth || document.documentElement.clientWidth || 360;
            const vh = window.innerHeight || document.documentElement.clientHeight || 640;

            // Header (~48px) + StatsBar (~38px) + Footer/Margins (~34px) = ~120px
            const maxAllowedHeight = Math.max(200, vh - 125);
            const maxAllowedWidth = Math.max(200, vw - 16);
            boardWidth = Math.floor(Math.min(maxAllowedWidth, maxAllowedHeight, 420));
            cellSize = boardWidth / gridSize;

            container.style.width = boardWidth + 'px';
            container.style.height = boardWidth + 'px';

            canvas.width = Math.floor(boardWidth * dpr);
            canvas.height = Math.floor(boardWidth * dpr);
            canvas.style.width = boardWidth + 'px';
            canvas.style.height = boardWidth + 'px';

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        window.addEventListener('resize', resize);
        window.addEventListener('orientationchange', () => setTimeout(resize, 100));
        window.addEventListener('load', resize);

        // --- Sector Initialization ---
        function initSector() {
            const def = SECTORS[currentSectorIdx];
            gridSize = def.size;
            pairs = def.pairs;
            paths = {};
            activeColor = null;
            isDrawing = false;
            lastCell = null;
            isVictory = false;
            particles = [];

            // Initialize empty paths
            pairs.forEach(p => {
                paths[p.color] = [];
            });

            victoryOverlay.classList.remove('active');
            sectorDisplay.textContent = `${currentSectorIdx + 1} (${gridSize}×${gridSize})`;

            // Update Level Select buttons active state
            Array.from(levelsContainer.children).forEach((b, idx) => {
                b.classList.toggle('active', idx === currentSectorIdx);
            });

            resize();
            updateStats();
        }

        function resetLevel() {
            initSector();
        }

        // --- Helpers ---
        function getBeaconAt(r, c) {
            for (let i = 0; i < pairs.length; i++) {
                const p = pairs[i];
                if ((p.p1[0] === r && p.p1[1] === c) || (p.p2[0] === r && p.p2[1] === c)) {
                    return p;
                }
            }
            return null;
        }

        function cellToPos(r, c) {
            return {
                x: (c + 0.5) * cellSize,
                y: (r + 0.5) * cellSize
            };
        }

        function posToCell(clientX, clientY, clampToGrid = false) {
            const rect = canvas.getBoundingClientRect();
            let relX = clientX - rect.left;
            let relY = clientY - rect.top;

            if (!clampToGrid) {
                if (relX < 0 || relX >= rect.width || relY < 0 || relY >= rect.height) {
                    return null;
                }
            } else {
                relX = Math.max(0, Math.min(rect.width - 1, relX));
                relY = Math.max(0, Math.min(rect.height - 1, relY));
            }

            const c = Math.floor((relX / rect.width) * gridSize);
            const r = Math.floor((relY / rect.height) * gridSize);
            return { r: Math.max(0, Math.min(gridSize - 1, r)), c: Math.max(0, Math.min(gridSize - 1, c)) };
        }

        // --- Manhattan Step Interpolation ---
        function getPathBetween(r0, c0, r1, c1) {
            const steps = [];
            let currR = r0;
            let currC = c0;
            while (currR !== r1 || currC !== c1) {
                const dr = r1 - currR;
                const dc = c1 - currC;
                if (Math.abs(dr) >= Math.abs(dc)) {
                    currR += Math.sign(dr);
                } else {
                    currC += Math.sign(dc);
                }
                steps.push({ r: currR, c: currC });
            }
            return steps;
        }

        // --- Drawing & Conduit Extension Logic ---
        function handlePointerDown(e) {
            if (isVictory) return;
            sound.init();

            try {
                canvas.setPointerCapture(e.pointerId);
            } catch (_) {}

            const cell = posToCell(e.clientX, e.clientY);
            if (!cell) return;

            // Check if tapped on a beacon
            const beacon = getBeaconAt(cell.r, cell.c);
            if (beacon) {
                activeColor = beacon.color;
                paths[activeColor] = [[cell.r, cell.c]];
                isDrawing = true;
                lastCell = cell;
                sound.step(activeColor);
                updateStats();
                return;
            }

            // Check if tapped on existing conduit line
            for (const colorStr in paths) {
                const color = parseInt(colorStr, 10);
                const path = paths[color];
                const idx = path.findIndex(p => p[0] === cell.r && p[1] === cell.c);
                if (idx !== -1) {
                    activeColor = color;
                    paths[color] = path.slice(0, idx + 1);
                    isDrawing = true;
                    lastCell = cell;
                    sound.step(activeColor);
                    updateStats();
                    return;
                }
            }
        }

        function stepIntoCell(cell) {
            if (activeColor === null) return;
            const path = paths[activeColor];
            if (!path || path.length === 0) return;

            const last = path[path.length - 1];
            if (last[0] === cell.r && last[1] === cell.c) return;

            // Backing up (re-tracing step)
            if (path.length > 1) {
                const secondLast = path[path.length - 2];
                if (secondLast[0] === cell.r && secondLast[1] === cell.c) {
                    path.pop();
                    sound.step(activeColor);
                    return;
                }
            }

            // Check if cell is an endpoint of a DIFFERENT color
            const beacon = getBeaconAt(cell.r, cell.c);
            if (beacon && beacon.color !== activeColor) return;

            // Check if crossing a DIFFERENT color's path -> sever existing path cleanly
            for (const colorStr in paths) {
                const otherColor = parseInt(colorStr, 10);
                if (otherColor === activeColor) continue;
                const otherPath = paths[otherColor];
                const crossIdx = otherPath.findIndex(p => p[0] === cell.r && p[1] === cell.c);
                if (crossIdx !== -1) {
                    paths[otherColor] = otherPath.slice(0, crossIdx);
                }
            }

            // Check if looping into OWN path -> truncate loop
            const ownIdx = path.findIndex(p => p[0] === cell.r && p[1] === cell.c);
            if (ownIdx !== -1) {
                paths[activeColor] = path.slice(0, ownIdx + 1);
                sound.step(activeColor);
                return;
            }

            // Extend path
            path.push([cell.r, cell.c]);
            sound.step(activeColor);

            // Check if reached destination beacon
            const targetPair = pairs.find(p => p.color === activeColor);
            const isDestination = (targetPair.p1[0] === cell.r && targetPair.p1[1] === cell.c) ||
                                  (targetPair.p2[0] === cell.r && targetPair.p2[1] === cell.c);

            if (isDestination && path.length > 1) {
                sound.connect(activeColor);
                isDrawing = false;
                activeColor = null;
            }
        }

        function handlePointerMove(e) {
            if (!isDrawing || activeColor === null || isVictory) return;

            const cell = posToCell(e.clientX, e.clientY, true);
            if (!cell) return;

            const path = paths[activeColor];
            if (!path || path.length === 0) return;

            const curHead = path[path.length - 1];
            if (curHead[0] === cell.r && curHead[1] === cell.c) return;

            // Interpolate straight Manhattan path steps to avoid missing cells during fast drag!
            const steps = getPathBetween(curHead[0], curHead[1], cell.r, cell.c);
            for (let i = 0; i < steps.length; i++) {
                if (!isDrawing || activeColor === null) break;
                stepIntoCell(steps[i]);
            }

            lastCell = cell;
            updateStats();
            checkVictory();
        }

        function handlePointerUp(e) {
            try {
                canvas.releasePointerCapture(e.pointerId);
            } catch (_) {}

            isDrawing = false;
            activeColor = null;
            lastCell = null;
            updateStats();
            checkVictory();
        }

        canvas.addEventListener('pointerdown', handlePointerDown);
        window.addEventListener('pointermove', handlePointerMove);
        window.addEventListener('pointerup', handlePointerUp);
        window.addEventListener('pointercancel', handlePointerUp);

        // --- Stats & Victory Check ---
        function isPathComplete(color) {
            const path = paths[color];
            if (!path || path.length < 2) return false;
            const pair = pairs.find(p => p.color === color);
            const start = path[0];
            const end = path[path.length - 1];

            return ((start[0] === pair.p1[0] && start[1] === pair.p1[1] && end[0] === pair.p2[0] && end[1] === pair.p2[1]) ||
                    (start[0] === pair.p2[0] && start[1] === pair.p2[1] && end[0] === pair.p1[0] && end[1] === pair.p1[1]));
        }

        function updateStats() {
            let connectedCount = 0;
            const occupiedCells = new Set();

            pairs.forEach(p => {
                if (isPathComplete(p.color)) connectedCount++;
                (paths[p.color] || []).forEach(pt => {
                    occupiedCells.add(`${pt[0]},${pt[1]}`);
                });
            });

            const totalCells = gridSize * gridSize;
            const pct = Math.floor((occupiedCells.size / totalCells) * 100);

            flowsDisplay.textContent = `${connectedCount}/${pairs.length}`;
            pipeDisplay.textContent = `${pct}%`;
        }

        function checkVictory() {
            if (isVictory) return;

            let allConnected = pairs.every(p => isPathComplete(p.color));
            if (!allConnected) return;

            const occupiedCells = new Set();
            pairs.forEach(p => {
                (paths[p.color] || []).forEach(pt => occupiedCells.add(`${pt[0]},${pt[1]}`));
            });

            const fullCoverage = occupiedCells.size === (gridSize * gridSize);

            // Victory achieved!
            isVictory = true;
            sound.victory();

            // Spawn victory confetti particles
            for (let i = 0; i < 50; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 40 + Math.random() * 180;
                particles.push({
                    x: boardWidth / 2,
                    y: boardWidth / 2,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: PALETTE[Math.floor(Math.random() * PALETTE.length)].fill,
                    radius: 2.5 + Math.random() * 3,
                    life: 1.0
                });
            }

            recapFlows.textContent = `${pairs.length}/${pairs.length}`;
            recapPipe.textContent = `${Math.floor((occupiedCells.size / (gridSize * gridSize)) * 100)}%`;

            if (fullCoverage) {
                victoryTitle.textContent = "PERFECT STABILIZATION!";
                victoryDesc.textContent = "All conduits connected with 100% grid energy coverage (★★★)!";
            } else {
                victoryTitle.textContent = "SECTOR CONNECTED!";
                victoryDesc.textContent = "All conduits linked! Can you cover 100% of the grid for 3 Stars?";
            }

            setTimeout(() => {
                victoryOverlay.classList.add('active');
            }, 350);
        }

        // --- Render Pass ---
        function render() {
            ctx.clearRect(0, 0, boardWidth, boardWidth);

            // Grid Lines & Cell Slots
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    const { x, y } = cellToPos(r, c);
                    ctx.strokeRect(c * cellSize, r * cellSize, cellSize, cellSize);

                    // Dim center node
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
                    ctx.beginPath();
                    ctx.arc(x, y, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Draw Conduits / Pipelines
            for (const colorStr in paths) {
                const color = parseInt(colorStr, 10);
                const path = paths[color];
                if (!path || path.length < 2) continue;

                const palette = PALETTE[color % PALETTE.length];
                const pipeWidth = cellSize * 0.38;

                ctx.save();
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                // Outer Glow Pass
                ctx.strokeStyle = palette.glow;
                ctx.lineWidth = pipeWidth + 8;
                ctx.beginPath();
                path.forEach((pt, idx) => {
                    const pos = cellToPos(pt[0], pt[1]);
                    if (idx === 0) ctx.moveTo(pos.x, pos.y);
                    else ctx.lineTo(pos.x, pos.y);
                });
                ctx.stroke();

                // Core Pipe Pass
                ctx.strokeStyle = palette.fill;
                ctx.lineWidth = pipeWidth;
                ctx.stroke();

                // Center Neon Highlight Line
                ctx.strokeStyle = palette.core;
                ctx.lineWidth = Math.max(2, pipeWidth * 0.28);
                ctx.stroke();

                ctx.restore();
            }

            // Draw Beacons (Endpoints)
            pairs.forEach(pair => {
                const palette = PALETTE[pair.color % PALETTE.length];
                const r = cellSize * 0.35;

                [pair.p1, pair.p2].forEach(pt => {
                    const pos = cellToPos(pt[0], pt[1]);

                    // Outer Halo
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, r + 4, 0, Math.PI * 2);
                    ctx.fillStyle = palette.glow;
                    ctx.fill();

                    // Main Beacon Planet
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2);
                    ctx.fillStyle = palette.fill;
                    ctx.fill();

                    // Inner Specular Core
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, r * 0.42, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();

                    ctx.restore();
                });
            });

            // Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * 0.016;
                p.y += p.vy * 0.016;
                p.life -= 0.02;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            requestAnimationFrame(render);
        }

        // --- Android Bridge Integration ---
        function restartWithAd() {
            if (window.Android && window.Android.showAd) {
                window.Android.showAd();
            } else {
                console.warn("Android interface not available, restarting directly.");
                window.restartGame();
            }
        }

        // Global Callback
        window.restartGame = function () {
            resetLevel();
        };

        // UI Event Listeners
        resetBtn.addEventListener('click', () => {
            restartWithAd();
        });

        soundBtn.addEventListener('click', () => {
            sound.enabled = !sound.enabled;
            soundBtn.textContent = sound.enabled ? '🔊' : '🔇';
        });

        sectorsBtn.addEventListener('click', () => {
            selectOverlay.classList.add('active');
        });

        closeSelectBtn.addEventListener('click', () => {
            selectOverlay.classList.remove('active');
        });

        nextLevelBtn.addEventListener('click', () => {
            currentSectorIdx = (currentSectorIdx + 1) % SECTORS.length;
            initSector();
        });

        // Boot
        initSector();
        requestAnimationFrame(render);
        setTimeout(resize, 100);
        setTimeout(resize, 350);
    })();
    </script>
</body>
</html>
